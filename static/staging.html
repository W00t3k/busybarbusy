<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Virtual Staging · BUSYBARBUSY</title>
  <link rel="icon" href="/favicon.ico">
  <style>
    :root{--bg:#090908;--panel:#11110f;--line:#312e28;--ink:#f5f2e9;--soft:#989187;--orange:#ff6a19;--green:#8fd14f;--mono:ui-monospace,SFMono-Regular,Menlo,monospace;--sans:Inter,ui-sans-serif,system-ui,sans-serif}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 85% 0,#46200c55,transparent 35%),var(--bg);color:var(--ink);font-family:var(--sans)}button,a{font:inherit}.shell{height:100vh;display:grid;grid-template-rows:auto 1fr;padding:18px;gap:14px}.bar{display:flex;align-items:center;gap:10px}.brand{font:800 14px var(--mono);letter-spacing:.12em}.brand i{color:var(--orange);font-style:normal}.status{margin-left:16px;color:var(--soft);font:10px var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.actions{margin-left:auto;display:flex;gap:8px}.btn{border:1px solid var(--line);background:#151411;color:var(--ink);padding:9px 13px;border-radius:8px;cursor:pointer;font-size:11px;text-decoration:none}.btn:hover{border-color:#71695d}.btn.hot{background:var(--orange);border-color:var(--orange);color:#190a02;font-weight:800}.btn:disabled{opacity:.5}.live{color:var(--green)}.stage{min-height:0;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--panel);box-shadow:0 30px 80px #0008}.stage iframe{display:block;width:100%;height:100%;border:0}.notice{position:fixed;right:22px;bottom:22px;background:#17140f;border:1px solid #6a432a;border-radius:9px;padding:11px 14px;font:10px var(--mono);opacity:0;transform:translateY(20px);transition:.2s}.notice.show{opacity:1;transform:none}.notice.bad{border-color:#a33}@media(max-width:720px){.shell{padding:10px}.bar{flex-wrap:wrap}.status{order:3;width:100%;margin:0}.actions{margin-left:auto}.btn{padding:8px 10px}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="bar">
      <div class="brand"><i>▧</i> VIRTUAL STAGING</div>
      <div class="status" id="status">Connecting to emulator…</div>
      <div class="actions">
        <a class="btn" href="/hub">← Bar Hub</a>
        <button class="btn" id="preview">Preview RSS</button>
        <button class="btn hot" id="push">Push current RSS</button>
      </div>
    </header>
    <section class="stage"><iframe id="emulator" title="BUSY Bar emulator"></iframe></section>
  </main>
  <div class="notice" id="notice"></div>
  <script>
    const $=s=>document.querySelector(s);
    async function api(path,body){const r=await fetch(path,body===undefined?{}:{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(body)}),d=await r.json();if(!r.ok)throw Error(d.error||`${r.status}`);return d}
    let timer;function toast(text,bad=false){const n=$("#notice");n.textContent=text;n.className="notice show"+(bad?" bad":"");clearTimeout(timer);timer=setTimeout(()=>n.className="notice",3500)}
    async function refresh(){try{const d=await api("/api/emulator");$("#emulator").src||= `http://${location.hostname}:8088/`;$("#status").className="status "+(d.running?"live":"");$("#status").textContent=d.frame_compatible?`● Current: ${d.frame_text||d.frame_application}`:d.frame_ready?"● Emulator-only frame · Preview RSS to replace it":"○ Virtual display empty"}catch(e){$("#status").textContent=e.message}}
    $("#preview").onclick=async e=>{const button=e.currentTarget;button.disabled=true;try{await api("/api/emulator/newsroom",{});toast("Newsroom is running virtually");setTimeout(refresh,1500)}catch(x){toast(x.message,true)}finally{button.disabled=false}};
    $("#push").onclick=async e=>{const button=e.currentTarget;button.disabled=true;try{const d=await api("/api/emulator/push",{});toast(`Pushed ${d.source_application} · ${d.elements} elements`)}catch(x){toast(x.message,true)}finally{button.disabled=false;refresh()}};
    refresh();setInterval(refresh,3000);
  </script>
</body>
</html>
