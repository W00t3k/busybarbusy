<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Network Hub</title>
<style>
:root{--bg:#050609;--card:#0b0e13e8;--line:#202631;--ink:#f5f7fb;--muted:#77808f;--orange:#ff6a35;--blue:#41a6ff;--cyan:#3ce7cf;--mono:ui-monospace,SFMono-Regular,Menlo,monospace}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 12% 0,#30130c,transparent 30rem),radial-gradient(circle at 90% 20%,#071d34,transparent 32rem),var(--bg);color:var(--ink);font-family:Inter,-apple-system,sans-serif;min-height:100vh}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.12;background-image:linear-gradient(#fff1 1px,transparent 1px),linear-gradient(90deg,#fff1 1px,transparent 1px);background-size:40px 40px}
.app{width:min(1480px,calc(100% - 32px));margin:auto;padding:24px 0 60px;position:relative}.top{display:flex;align-items:center;gap:16px;margin-bottom:18px}.signal{width:46px;height:46px;border:1px solid #ff6a3555;border-radius:15px;display:grid;place-items:center;background:#ff6a3512;box-shadow:0 0 32px #ff6a3520}.signal svg{width:27px;color:var(--orange)}h1{font-size:19px;margin:0}.sub,.label{font:10px var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.12em}.live{margin-left:auto;font:10px var(--mono);color:var(--cyan);display:flex;gap:8px;align-items:center}.live i{width:7px;height:7px;background:var(--cyan);border-radius:50%;box-shadow:0 0 14px var(--cyan)}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:12px}.card{grid-column:span 3;background:linear-gradient(155deg,#10151bea,#090c11ee);border:1px solid var(--line);border-radius:17px;padding:16px;box-shadow:0 24px 60px -32px #000,inset 0 1px #fff1;overflow:hidden}.wide{grid-column:span 6}.full{grid-column:1/-1}.value{font:700 31px var(--mono);letter-spacing:-.06em;margin:9px 0 2px}.hint{font:10px/1.5 var(--mono);color:var(--muted)}.meter{height:6px;background:#040506;border-radius:8px;overflow:hidden;margin:12px 0}.meter i{height:100%;display:block;background:linear-gradient(90deg,var(--orange),#ffc14d);box-shadow:0 0 12px var(--orange)}
.chart{width:100%;height:94px;margin-top:8px;display:block}.chart path{fill:none;stroke:var(--blue);stroke-width:2;vector-effect:non-scaling-stroke}.chart .orange{stroke:var(--orange)}.chart .fill{fill:url(#fade);stroke:none}.split{display:flex;gap:34px}.ssid{font:700 22px var(--mono);margin:10px 0;overflow:hidden;text-overflow:ellipsis}.aps{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px;margin-top:12px}.ap{border:1px solid var(--line);border-radius:11px;padding:10px;background:#06080c}.ap-top{display:flex;justify-content:space-between;font:11px var(--mono)}.bar{height:3px;background:#151a22;margin-top:8px}.bar i{display:block;height:100%;background:var(--cyan)}
.clients{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px;margin-top:12px}.client{border-left:2px solid var(--orange);background:#070a0f;padding:10px 12px}.client b{font-size:12px}.client div{font:9px/1.5 var(--mono);color:var(--muted);margin-top:4px}.proc{display:grid;grid-template-columns:60px minmax(130px,1fr) 65px 65px;gap:10px;padding:7px 0;border-bottom:1px solid #171c24;font:10px var(--mono)}.proc span:nth-last-child(-n+2){text-align:right;color:var(--muted)}button{border:1px solid #38404d;background:#121720;color:var(--ink);padding:7px 10px;border-radius:8px;font:10px var(--mono);cursor:pointer}button:hover{border-color:var(--orange)}.head{display:flex;align-items:center}.head button{margin-left:auto}.error{color:#ff7188}
@media(max-width:900px){.card,.wide{grid-column:span 6}}@media(max-width:580px){.card,.wide{grid-column:1/-1}.split{gap:18px}.app{width:calc(100% - 18px)}}
</style>
</head>
<body><main class="app">
<header class="top"><div class="signal"><svg viewBox="0 0 28 28"><circle cx="14" cy="22" r="1.7" fill="currentColor"/><path d="M8.5 16.5a8 8 0 0 1 11 0M4.5 11.5a14 14 0 0 1 19 0M1 6.5a20 20 0 0 1 26 0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></div><div><h1>Network Hub</h1><div class="sub" id="identity">system + wifi observatory</div></div><div class="live"><i></i><span id="sample">LIVE</span></div></header>
<section class="grid">
<article class="card"><div class="label">CPU</div><div class="value" id="cpu">—</div><div class="meter"><i id="cpuBar"></i></div><div class="hint" id="load">—</div><svg class="chart" id="cpuChart" viewBox="0 0 300 94"></svg></article>
<article class="card"><div class="label">Memory</div><div class="value" id="memory">—</div><div class="meter"><i id="memoryBar"></i></div><div class="hint" id="memoryHint">—</div><svg class="chart" id="memoryChart" viewBox="0 0 300 94"></svg></article>
<article class="card"><div class="label">Disk</div><div class="value" id="disk">—</div><div class="meter"><i id="diskBar"></i></div><div class="hint">Root volume utilization</div><svg class="chart" id="diskChart" viewBox="0 0 300 94"></svg></article>
<article class="card"><div class="label">Uptime</div><div class="value" id="uptime">—</div><div class="hint" id="cores">—</div><div id="volumes" class="hint" style="margin-top:18px"></div></article>
<article class="card wide"><div class="label">Network throughput</div><div class="split"><div><div class="value" id="down">—</div><div class="hint">download</div></div><div><div class="value" id="up">—</div><div class="hint">upload</div></div></div><svg class="chart" id="netChart" viewBox="0 0 620 94"></svg><div class="hint" id="netTotals">—</div></article>
<article class="card wide"><div class="head"><div class="label">Wi‑Fi spectrum</div><button id="scan">SCAN</button></div><div class="ssid" id="ssid">—</div><div class="hint" id="wifiMeta">Waiting for scan data</div><div class="aps" id="aps"></div></article>
<article class="card full"><div class="head"><div class="label">Router clients</div><button id="routerReload">REFRESH</button></div><div class="hint" id="clientMeta">Loading router topology…</div><div class="clients" id="clients"></div></article>
<article class="card full"><div class="label">Top processes</div><div class="proc" style="color:var(--muted)"><span>PID</span><span>PROCESS</span><span>CPU</span><span>MEM</span></div><div id="processes"></div></article>
</section></main>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const api=async(path,post=false)=>{const r=await fetch(path,{method:post?"POST":"GET"}),d=await r.json();if(!r.ok)throw Error(d.error||"request failed");return d};
const path=(a,w,h=94)=>{if(!a?.length)return"";const max=Math.max(1,...a),n=a.length;return"M"+a.map((v,i)=>`${i/Math.max(1,n-1)*w},${h-4-v/max*(h-8)}`).join(" L")};
const chart=(id,a,b,w=300)=>{$(id).innerHTML=`<path d="${path(a,w)}"></path>${b?`<path class="orange" d="${path(b,w)}"></path>`:""}`};
const age=s=>`${Math.floor(s/86400)}d ${Math.floor(s%86400/3600)}h ${Math.floor(s%3600/60)}m`;
async function system(){try{const d=await api("/api/system"),h=d.history;$("#identity").textContent=`${d.host} · system + wifi observatory`;$("#sample").textContent=new Date(d.at*1000).toLocaleTimeString();$("#cpu").textContent=d.cpu.percent+"%";$("#cpuBar").style.width=d.cpu.percent+"%";$("#load").textContent=`load ${d.cpu.load.map(x=>x.toFixed(2)).join(" · ")}`;$("#memory").textContent=d.memory.percent+"%";$("#memoryBar").style.width=d.memory.percent+"%";$("#memoryHint").textContent=`${d.memory.used} used · ${d.memory.available} free`;$("#disk").textContent=d.disk.percent+"%";$("#diskBar").style.width=d.disk.percent+"%";$("#uptime").textContent=age(d.uptime);$("#cores").textContent=`${d.cpu.cores} logical cores · ${d.memory.total} RAM`;$("#down").textContent=d.network.down_label;$("#up").textContent=d.network.up_label;$("#netTotals").textContent=`received ${d.network.received} · sent ${d.network.sent}`;$("#volumes").innerHTML=d.disk.volumes.slice(0,3).map(v=>`${esc(v.name)} · ${v.percent}%<br>`).join("");$("#processes").innerHTML=d.processes.map(p=>`<div class="proc"><span>${p.pid}</span><span>${esc(p.name)}</span><span>${p.cpu}%</span><span>${p.memory}%</span></div>`).join("");chart("#cpuChart",h.cpu);chart("#memoryChart",h.memory);chart("#diskChart",h.disk);chart("#netChart",h.down,h.up,620)}catch(e){$("#sample").textContent=e.message;$("#sample").className="error"}}
async function wifi(scan=false){try{const d=await api(scan?"/api/wifi/scan":"/api/wifi",scan),best=d.strongest,w=d.device_wifi||{};$("#ssid").textContent=w.ssid||best?.ssid||"Not associated";$("#wifiMeta").textContent=`${d.count} access points · ${w.state||"scanner ready"}${best?` · strongest ${best.signal}${best.unit}`:""}`;$("#aps").innerHTML=(d.networks||[]).slice(0,12).map(n=>`<div class="ap"><div class="ap-top"><b>${esc(n.ssid)}</b><span>${n.signal}${esc(n.unit)}</span></div><div class="hint">channel ${n.channel||"—"} · ${esc(n.band||n.security||"—")}</div><div class="bar"><i style="width:${Math.max(5,Math.min(100,n.unit==="%"?n.signal:100+n.signal))}%"></i></div></div>`).join("")}catch(e){$("#wifiMeta").textContent=e.message}}
async function router(){try{const d=await api("/api/router",true),active=(d.clients||[]).filter(c=>c.active);$("#clientMeta").textContent=`${active.length} active · ${d.device_count} known devices`;$("#clients").innerHTML=active.map(c=>`<div class="client"><b>${esc(c.name)}</b><div>${esc(c.raw?.ip||"no IP")} · ${esc(c.raw?.port||"unknown link")}<br>↓ ${c.bytes_rx?.toLocaleString()||0} · ↑ ${c.bytes_tx?.toLocaleString()||0}</div></div>`).join("")}catch(e){$("#clientMeta").textContent=e.message;$("#clientMeta").className="hint error"}}
$("#scan").onclick=()=>wifi(true);$("#routerReload").onclick=router;system();wifi();router();setInterval(system,2500);setInterval(wifi,30000);setInterval(router,45000);
</script></body></html>
